<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Movie Recommender</title>
  <meta name="description" content="AI & Machine Learning powered Movie Recommendation engine with TMDB and TF-IDF content filtering">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(23, 31, 48, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --radius: 14px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b 0%, var(--bg) 45%, #050811 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Navbar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 13, 22, 0.82);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 1.5rem;
    }

    .nav-container {
      max-width: 1360px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .logo span {
      background: linear-gradient(135deg, #a5b4fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Search bar & autocomplete container */
    .search-wrapper {
      position: relative;
      flex: 1;
      max-width: 560px;
    }

    .search-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input-box input {
      width: 100%;
      padding: 0.65rem 1rem 0.65rem 2.6rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .search-input-box input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      color: var(--text-muted);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 0.85rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: none;
    }

    /* Autocomplete dropdown */
    .suggestions-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      z-index: 200;
      display: none;
      max-height: 380px;
      overflow-y: auto;
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.65rem 0.95rem;
      cursor: pointer;
      transition: background 0.15s ease;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover, .suggestion-item.active {
      background: rgba(99, 102, 241, 0.2);
    }

    .suggestion-poster {
      width: 34px;
      height: 50px;
      border-radius: 4px;
      object-fit: cover;
      background: #1e293b;
      flex-shrink: 0;
    }

    .suggestion-info {
      flex: 1;
      min-width: 0;
    }

    .suggestion-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-year {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Main Container */
    main {
      max-width: 1360px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 4rem;
    }

    /* Category pills */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .categories {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .category-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.45rem 1rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }

    .category-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .category-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .section-title {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.35rem;
    }

    .movie-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      position: relative;
    }

    .movie-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.45);
      border-color: rgba(99, 102, 241, 0.5);
    }

    .poster-wrap {
      position: relative;
      aspect-ratio: 2/3;
      background: #111827;
      overflow: hidden;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .movie-card:hover .poster-img {
      transform: scale(1.05);
    }

    .no-poster {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      gap: 0.5rem;
      background: #1e293b;
    }

    .badge-rating {
      position: absolute;
      top: 0.6rem;
      right: 0.6rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #facc15;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .similarity-badge {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      background: rgba(99, 102, 241, 0.88);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
    }

    .card-body {
      padding: 0.75rem 0.85rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 0.35rem;
    }

    .card-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: auto;
    }

    /* Details View */
    .details-view {
      display: none;
    }

    .back-nav {
      margin-bottom: 1.25rem;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0.55rem 1.15rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: var(--transition);
      font-family: inherit;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateX(-3px);
    }

    .hero-banner {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      border: 1px solid var(--card-border);
      margin-bottom: 2.5rem;
      min-height: 380px;
      display: flex;
      align-items: flex-end;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.2) 0%, rgba(9, 13, 22, 0.88) 70%, #090d16 100%);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 2rem;
      display: flex;
      gap: 2rem;
      align-items: flex-end;
      width: 100%;
    }

    .hero-poster {
      width: 190px;
      aspect-ratio: 2/3;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      background: #1e293b;
    }

    .hero-info {
      flex: 1;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
      line-height: 1.15;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }

    .genre-tag {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(99, 102, 241, 0.5);
      color: #c7d2fe;
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
    }

    .hero-meta-row {
      display: flex;
      gap: 1.25rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 0.95rem;
    }

    .hero-overview {
      font-size: 0.95rem;
      color: #cbd5e1;
      max-width: 800px;
      line-height: 1.6;
    }

    .recommendations-section {
      margin-top: 2.5rem;
    }

    /* Skeleton loaders */
    .skeleton-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius);
      aspect-ratio: 2/3;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }

    /* Banner / Alerts */
    .alert-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    @media (max-width: 768px) {
      .hero-content {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      .hero-poster {
        width: 140px;
      }
      .hero-title {
        font-size: 1.6rem;
      }
      .hero-tags, .hero-meta-row {
        justify-content: center;
      }
      .movie-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header / Navigation -->
  <header>
    <div class="nav-container">
      <a href="/" class="logo" id="logoLink">
        🎬 <span>MovieRec</span>
      </a>

      <!-- Search input + Dropdown -->
      <div class="search-wrapper">
        <div class="search-input-box">
          <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search by title (e.g. Batman, Inception)..." autocomplete="off" />
          <button id="clearSearch" class="clear-btn" title="Clear search">&times;</button>
        </div>
        <div id="suggestionsBox" class="suggestions-dropdown"></div>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main>
    <div id="alertBanner" class="alert-banner"></div>

    <!-- HOME VIEW -->
    <div id="homeView">
      <div class="controls-row">
        <div class="categories" id="categoryButtons">
          <button class="category-btn active" data-category="popular">⭐ Popular</button>
          <button class="category-btn" data-category="trending">🔥 Trending</button>
          <button class="category-btn" data-category="top_rated">🏆 Top Rated</button>
          <button class="category-btn" data-category="now_playing">🍿 Now Playing</button>
          <button class="category-btn" data-category="upcoming">🚀 Upcoming</button>
        </div>
      </div>

      <h2 id="viewHeading" class="section-title">Popular Movies</h2>
      <div id="movieGrid" class="movie-grid"></div>
    </div>

    <!-- DETAILS VIEW -->
    <div id="detailsView" class="details-view">
      <div class="back-nav">
        <button id="backBtn" class="back-btn">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to Movies
        </button>
      </div>

      <div id="heroBanner" class="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <img id="detailPoster" class="hero-poster" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Poster" />
          <div class="hero-info">
            <h1 id="detailTitle" class="hero-title"></h1>
            <div id="detailGenres" class="hero-tags"></div>
            <div class="hero-meta-row">
              <span id="detailRelease">📅 -</span>
              <span id="detailRating">⭐ -</span>
            </div>
            <p id="detailOverview" class="hero-overview"></p>
          </div>
        </div>
      </div>

      <!-- TF-IDF Content Recommendations -->
      <div class="recommendations-section" id="tfidfSection">
        <h3 class="section-title">🔎 Similar Movies (Content-Based / TF-IDF)</h3>
        <div id="tfidfGrid" class="movie-grid"></div>
      </div>

      <!-- Genre Recommendations -->
      <div class="recommendations-section" id="genreSection">
        <h3 class="section-title">🎭 More Like This (Genre-Based)</h3>
        <div id="genreGrid" class="movie-grid"></div>
      </div>
    </div>
  </main>

  <script>
    // State management
    const state = {
      currentCategory: 'popular',
      searchQuery: '',
      selectedMovieId: null,
      searchTimeout: null,
    };

    // DOM Elements
    const homeView = document.getElementById('homeView');
    const detailsView = document.getElementById('detailsView');
    const movieGrid = document.getElementById('movieGrid');
    const viewHeading = document.getElementById('viewHeading');
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const suggestionsBox = document.getElementById('suggestionsBox');
    const categoryButtons = document.querySelectorAll('.category-btn');
    const backBtn = document.getElementById('backBtn');
    const logoLink = document.getElementById('logoLink');
    const alertBanner = document.getElementById('alertBanner');

    // Helper: show banner errors
    function showAlert(msg) {
      alertBanner.textContent = msg;
      alertBanner.style.display = 'block';
    }
    function hideAlert() {
      alertBanner.style.display = 'none';
    }

    // Helper: Skeleton Loading Cards
    function renderSkeletons(container, count = 12) {
      container.innerHTML = Array(count)
        .fill(0)
        .map(() => '<div class="skeleton-card"></div>')
        .join('');
    }

    // Render Movie Card HTML
    function createCardHTML(movie, similarityScore = null) {
      const title = movie.title || movie.name || 'Untitled';
      const year = movie.release_date ? movie.release_date.substring(0, 4) : '';
      const rating = movie.vote_average ? movie.vote_average.toFixed(1) : null;
      const tmdbId = movie.tmdb_id || movie.id;

      const posterHTML = movie.poster_url
        ? `<img class="poster-img" src="${movie.poster_url}" alt="${title}" loading="lazy" />`
        : `<div class="no-poster"><span>🎬</span><span>No Poster</span></div>`;

      const ratingHTML = rating
        ? `<div class="badge-rating">⭐ ${rating}</div>`
        : '';

      const scoreHTML = similarityScore !== null
        ? `<div class="similarity-badge">${Math.round(similarityScore * 100)}% match</div>`
        : '';

      return `
        <div class="movie-card" onclick="openMovieDetails(${tmdbId})">
          <div class="poster-wrap">
            ${posterHTML}
            ${ratingHTML}
            ${scoreHTML}
          </div>
          <div class="card-body">
            <div class="card-title" title="${title}">${title}</div>
            <div class="card-meta">${year ? '📅 ' + year : ''}</div>
          </div>
        </div>
      `;
    }

    // Fetch and display Home Feed
    async function loadCategoryFeed(category) {
      state.currentCategory = category;
      state.searchQuery = '';
      searchInput.value = '';
      clearSearch.style.display = 'none';
      suggestionsBox.style.display = 'none';

      const titles = {
        popular: '⭐ Popular Movies',
        trending: '🔥 Trending Today',
        top_rated: '🏆 Top Rated Classics',
        now_playing: '🍿 Now Playing in Theaters',
        upcoming: '🚀 Upcoming Releases'
      };
      viewHeading.textContent = titles[category] || 'Movies';

      renderSkeletons(movieGrid, 18);
      showHomeView();

      try {
        const res = await fetch(`/home?category=${encodeURIComponent(category)}&limit=30`);
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || `HTTP ${res.status}`);
        }
        const movies = await res.json();
        hideAlert();

        if (!movies || movies.length === 0) {
          movieGrid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">No movies found.</p>';
          return;
        }

        movieGrid.innerHTML = movies.map(m => createCardHTML(m)).join('');
      } catch (err) {
        showAlert(`Failed to load ${category} feed: ${err.message}. Please check TMDB_API_KEY.`);
        movieGrid.innerHTML = '';
      }
    }

    // Live search autocomplete
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearSearch.style.display = q ? 'block' : 'none';

      clearTimeout(state.searchTimeout);
      if (q.length < 2) {
        suggestionsBox.style.display = 'none';
        return;
      }

      state.searchTimeout = setTimeout(() => {
        fetchSuggestions(q);
      }, 250);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = searchInput.value.trim();
        if (q) {
          suggestionsBox.style.display = 'none';
          executeFullSearch(q);
        }
      }
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      clearSearch.style.display = 'none';
      suggestionsBox.style.display = 'none';
      loadCategoryFeed(state.currentCategory);
    });

    async function fetchSuggestions(query) {
      try {
        const res = await fetch(`/tmdb/search?query=${encodeURIComponent(query)}`);
        if (!res.ok) return;
        const data = await res.json();
        const results = data.results || (Array.isArray(data) ? data : []);

        if (results.length === 0) {
          suggestionsBox.innerHTML = '<div style="padding:0.75rem 1rem;color:var(--text-muted);font-size:0.85rem;">No suggestions found</div>';
          suggestionsBox.style.display = 'block';
          return;
        }

        suggestionsBox.innerHTML = results.slice(0, 8).map(m => {
          const title = m.title || m.name || '';
          const year = (m.release_date || '').substring(0, 4);
          const poster = m.poster_path ? `https://image.tmdb.org/t/p/w200${m.poster_path}` : '';
          const tmdbId = m.id;
          return `
            <div class="suggestion-item" onclick="openMovieDetails(${tmdbId})">
              ${poster ? `<img class="suggestion-poster" src="${poster}" alt="" />` : '<div class="suggestion-poster"></div>'}
              <div class="suggestion-info">
                <div class="suggestion-title">${title}</div>
                <div class="suggestion-year">${year}</div>
              </div>
            </div>
          `;
        }).join('');
        suggestionsBox.style.display = 'block';
      } catch (err) {
        // silent fail on suggestions
      }
    }

    // Close suggestions on outside click
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        suggestionsBox.style.display = 'none';
      }
    });

    // Execute full search and populate grid
    async function executeFullSearch(query) {
      state.searchQuery = query;
      suggestionsBox.style.display = 'none';
      showHomeView();
      viewHeading.textContent = `Search results for "${query}"`;
      renderSkeletons(movieGrid, 12);

      try {
        const res = await fetch(`/tmdb/search?query=${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const results = data.results || (Array.isArray(data) ? data : []);

        const cards = results.map(m => ({
          tmdb_id: m.id,
          title: m.title || m.name,
          poster_url: m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : null,
          release_date: m.release_date,
          vote_average: m.vote_average
        }));

        if (cards.length === 0) {
          movieGrid.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">No movies found matching your search.</p>';
          return;
        }

        movieGrid.innerHTML = cards.map(m => createCardHTML(m)).join('');
      } catch (err) {
        showAlert(`Search failed: ${err.message}`);
      }
    }

    // Open Movie Details + Recommendations
    async function openMovieDetails(tmdbId) {
      suggestionsBox.style.display = 'none';
      state.selectedMovieId = tmdbId;
      showDetailsView();
      window.history.pushState({ view: 'details', id: tmdbId }, '', `?id=${tmdbId}`);

      // Reset detail elements
      document.getElementById('detailTitle').textContent = 'Loading...';
      document.getElementById('detailOverview').textContent = '';
      document.getElementById('detailGenres').innerHTML = '';
      document.getElementById('detailRelease').textContent = '📅 Loading...';
      document.getElementById('detailRating').textContent = '⭐ -';
      document.getElementById('detailPoster').src = '';
      document.getElementById('heroBanner').style.backgroundImage = 'none';
      renderSkeletons(document.getElementById('tfidfGrid'), 6);
      renderSkeletons(document.getElementById('genreGrid'), 6);

      try {
        // Fetch details
        const res = await fetch(`/movie/id/${tmdbId}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const details = await res.json();

        // Populate details
        document.getElementById('detailTitle').textContent = details.title || 'Untitled';
        document.getElementById('detailOverview').textContent = details.overview || 'No overview available.';
        document.getElementById('detailRelease').textContent = details.release_date ? `📅 ${details.release_date}` : '📅 -';
        
        if (details.poster_url) {
          document.getElementById('detailPoster').src = details.poster_url;
          document.getElementById('detailPoster').style.display = 'block';
        } else {
          document.getElementById('detailPoster').style.display = 'none';
        }

        if (details.backdrop_url) {
          document.getElementById('heroBanner').style.backgroundImage = `url('${details.backdrop_url}')`;
        }

        const genresContainer = document.getElementById('detailGenres');
        genresContainer.innerHTML = (details.genres || []).map(g => `<span class="genre-tag">${g.name}</span>`).join('');

        // Fetch Recommendations via Bundle Endpoint
        loadRecommendations(details.title, tmdbId);
      } catch (err) {
        showAlert(`Failed to load details: ${err.message}`);
      }
    }

    // Fetch recommendations
    async function loadRecommendations(title, tmdbId) {
      const tfidfContainer = document.getElementById('tfidfGrid');
      const genreContainer = document.getElementById('genreGrid');

      try {
        const res = await fetch(`/movie/search?query=${encodeURIComponent(title)}&tfidf_top_n=12&genre_limit=12`);
        if (res.ok) {
          const bundle = await res.json();

          // TF-IDF Cards
          const tfidfItems = (bundle.tfidf_recommendations || []).filter(item => item.tmdb);
          if (tfidfItems.length > 0) {
            tfidfContainer.innerHTML = tfidfItems.map(item => createCardHTML(item.tmdb, item.score)).join('');
          } else {
            tfidfContainer.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">No content-based recommendations found in dataset for this title.</p>';
          }

          // Genre Cards
          const genreItems = bundle.genre_recommendations || [];
          if (genreItems.length > 0) {
            genreContainer.innerHTML = genreItems.map(m => createCardHTML(m)).join('');
          } else {
            genreContainer.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">No genre recommendations found.</p>';
          }
          return;
        }
      } catch (e) {
        // Fallback to genre only
      }

      // Fallback: fetch genre recommendations directly
      try {
        const resGenre = await fetch(`/recommend/genre?tmdb_id=${tmdbId}&limit=12`);
        if (resGenre.ok) {
          const genreCards = await resGenre.json();
          genreContainer.innerHTML = genreCards.map(m => createCardHTML(m)).join('');
          tfidfContainer.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">Local ML recommendations unavailable for this item.</p>';
        }
      } catch (e) {
        genreContainer.innerHTML = '<p style="color:var(--text-muted);grid-column:1/-1;">No recommendations available.</p>';
      }
    }

    // View Switching
    function showHomeView() {
      homeView.style.display = 'block';
      detailsView.style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showDetailsView() {
      homeView.style.display = 'none';
      detailsView.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Event Listeners
    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadCategoryFeed(btn.dataset.category);
      });
    });

    backBtn.addEventListener('click', () => {
      showHomeView();
      window.history.pushState({}, '', '/');
    });

    logoLink.addEventListener('click', (e) => {
      e.preventDefault();
      categoryButtons.forEach(b => b.classList.remove('active'));
      categoryButtons[0].classList.add('active');
      loadCategoryFeed('popular');
      window.history.pushState({}, '', '/');
    });

    // History Popstate Handling
    window.addEventListener('popstate', (e) => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (id) {
        openMovieDetails(parseInt(id, 10));
      } else {
        showHomeView();
      }
    });

    // Initial Load
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (id) {
        openMovieDetails(parseInt(id, 10));
      } else {
        loadCategoryFeed('popular');
      }
    });
  </script>
</body>
</html>
